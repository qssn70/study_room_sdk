name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_goldens:
        description: Generate the eight Ubuntu Golden baselines for review
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart-dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan Dart and Flutter workspace dependencies
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --lockfile=./pubspec.lock

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p artifacts/ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace study-room-server run db:generate
      - name: Generate OpenAPI-derived TypeScript, DTO, and Dart artifacts
        run: npm run generate:contracts
      - name: Validate OpenAPI and generated artifacts
        run: npm run check:contracts
      - name: Verify generated artifacts have no diff
        shell: bash
        run: |
          generated_status="$(git status --porcelain --untracked-files=all -- \
            server/src/generated/contract-types.ts \
            server/src/generated/request-dtos.ts \
            packages/study_room_sdk/lib/src/generated_contract.dart)"
          if [[ -n "$generated_status" ]]; then
            echo "$generated_status"
            git diff -- \
              server/src/generated/contract-types.ts \
              server/src/generated/request-dtos.ts \
              packages/study_room_sdk/lib/src/generated_contract.dart
            exit 1
          fi
          node -e "require('fs').writeFileSync('artifacts/ci/contracts.json', JSON.stringify({schemaVersion:1,commitSha:process.env.GITHUB_SHA,generatedDiff:false}, null, 2) + '\n')"
      - name: Build server
        run: npm run build
      - name: Test release evidence tooling
        run: npm run test:release-tools
      - name: Test server with line and branch coverage
        run: npm --workspace study-room-server run test:coverage
      - name: Enforce server line and branch coverage thresholds
        run: node tool/check-lcov.mjs server/coverage/lcov.info 80 80 --output artifacts/ci/server-coverage.json
      - name: Audit npm dependencies
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=high --json | tee artifacts/ci/npm-audit.json
      - name: Upload server CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-server-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci
          if-no-files-found: error
          retention-days: 30

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p artifacts/ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true
      - run: flutter pub get
      - name: Regenerate Flutter localization artifacts
        shell: bash
        run: |
          (cd packages/study_room_ui && flutter gen-l10n && dart run tool/generate_localizations_compat.dart)
          (cd apps/example_flutter && flutter gen-l10n)
      - name: Verify Flutter localization artifacts have no diff
        shell: bash
        run: |
          localization_status="$(git status --porcelain --untracked-files=all -- \
            packages/study_room_ui/lib/src/generated/l10n \
            packages/study_room_ui/lib/src/localizations_compat.dart \
            apps/example_flutter/lib/l10n/generated)"
          if [[ -n "$localization_status" ]]; then
            echo "$localization_status"
            git diff -- \
              packages/study_room_ui/lib/src/generated/l10n \
              packages/study_room_ui/lib/src/localizations_compat.dart \
              apps/example_flutter/lib/l10n/generated
            exit 1
          fi
      - name: Analyze SDK, UI, and example
        run: |
          dart analyze packages/study_room_sdk
          flutter analyze packages/study_room_ui
          flutter analyze apps/example_flutter
      - name: Test SDK with line and branch coverage
        working-directory: packages/study_room_sdk
        run: dart test --coverage-path=coverage/lcov.info --branch-coverage
      - name: Enforce SDK line and branch coverage thresholds
        run: node tool/check-lcov.mjs packages/study_room_sdk/coverage/lcov.info 80 80 --output artifacts/ci/sdk-coverage.json
      - name: Test UI with line coverage
        working-directory: packages/study_room_ui
        run: flutter test --coverage
      - name: Enforce UI line coverage threshold
        run: node tool/check-lcov.mjs packages/study_room_ui/coverage/lcov.info 70 --output artifacts/ci/ui-coverage.json
      - name: Test example
        working-directory: apps/example_flutter
        run: flutter test
      - name: Package publication checks
        shell: bash
        run: |
          set -euo pipefail
          (cd packages/study_room_sdk && dart pub publish --dry-run) 2>&1 | tee artifacts/ci/sdk-publish-dry-run.log
          (cd packages/study_room_ui && flutter pub publish --dry-run) 2>&1 | tee artifacts/ci/ui-publish-dry-run.log
          node - <<'NODE'
          const { writeFileSync } = require('node:fs');
          for (const name of [
            'GITHUB_SHA',
            'GITHUB_SERVER_URL',
            'GITHUB_REPOSITORY',
            'GITHUB_RUN_ID',
            'GITHUB_RUN_ATTEMPT',
          ]) {
            if (!process.env[name]) throw new Error(`${name} is required for publish dry-run evidence`);
          }
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const result = {
            schemaVersion: 1,
            commitSha: process.env.GITHUB_SHA,
            runUrl,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            packages: {
              study_room_sdk: { passed: true, log: 'sdk-publish-dry-run.log' },
              study_room_ui: { passed: true, log: 'ui-publish-dry-run.log' },
            },
            passed: true,
          };
          writeFileSync('artifacts/ci/publish-dry-run.json', `${JSON.stringify(result, null, 2)}\n`);
          NODE
      - name: Upload Flutter CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-flutter-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci
          if-no-files-found: error
          retention-days: 30

  golden:
    name: Golden tests (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STUDY_ROOM_RUN_GOLDENS: "true"
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p artifacts/ci
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true
      - run: flutter pub get
      - name: Generate Ubuntu Golden baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_goldens }}
        working-directory: packages/study_room_ui
        run: flutter test --no-pub --dart-define=STUDY_ROOM_RUN_GOLDENS=true --update-goldens test/golden/study_room_golden_harness_test.dart
      - name: Validate the Golden baseline set
        shell: bash
        working-directory: packages/study_room_ui
        run: |
          set -euo pipefail
          baseline_dir='test/golden/baselines'
          expected=(
            analytics_desktop.png
            focus_compact_landscape.png
            focus_desktop.png
            focus_portrait_centered.png
            focus_portrait_immersive.png
            focus_portrait_split.png
            history_desktop.png
            room_management.png
          )

          if [[ ! -d "$baseline_dir" ]]; then
            echo "::error::Golden baseline directory is missing: $baseline_dir"
            exit 1
          fi

          mapfile -t actual < <(
            find "$baseline_dir" -maxdepth 1 -type f -name '*.png' -printf '%f\n' | sort
          )
          if [[ ${#actual[@]} -ne ${#expected[@]} ]] || \
             ! diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}"); then
            echo "::error::Expected exactly the eight declared Ubuntu Golden PNGs"
            printf 'Found: %s\n' "${actual[*]:-none}"
            exit 1
          fi
      - name: Run UI tests including Golden comparisons
        working-directory: packages/study_room_ui
        run: flutter test --no-pub --dart-define=STUDY_ROOM_RUN_GOLDENS=true test/golden/study_room_golden_harness_test.dart
      - name: Record successful Golden evidence
        working-directory: packages/study_room_ui
        run: node ../../tool/golden-evidence.mjs test/golden/baselines ../../artifacts/ci/golden-evidence.json
      - name: Upload Golden CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-golden-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci
          if-no-files-found: warn
          retention-days: 30
      - name: Upload generated Ubuntu Golden baselines
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.update_goldens }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-baselines-${{ github.sha }}
          path: |
            packages/study_room_ui/test/golden/baselines/**
            packages/study_room_ui/test/failures/**
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Golden expected, actual, and diff images
        if: ${{ failure() && (github.event_name != 'workflow_dispatch' || inputs.update_goldens != true) }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-failure-${{ github.sha }}
          path: |
            packages/study_room_ui/test/golden/baselines/**
            packages/study_room_ui/test/failures/**
          if-no-files-found: warn
          retention-days: 14

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate secure default Compose profile
        shell: bash
        env:
          POSTGRES_PASSWORD: ci-only-compose-validation
          STUDY_ROOM_ADMIN_JWKS_URL: https://admin.example.test/jwks.json
          STUDY_ROOM_ADMIN_JWT_ISSUER: https://admin.example.test
          STUDY_ROOM_ADMIN_JWT_AUDIENCE: study-room-admin
        run: |
          set -euo pipefail
          docker compose config > /tmp/study-room-compose-base.yml
          diff -u \
            <(printf '%s\n' api-1 api-2 migrate postgres proxy redis | sort) \
            <(docker compose config --services | sort)
          if grep -Fq 'jwks:4000' /tmp/study-room-compose-base.yml || \
             grep -Fq 'E2E_FIXTURE_CONTROL_TOKEN' /tmp/study-room-compose-base.yml || \
             grep -Eq 'STUDY_ROOM_ALLOW_INSECURE_JWKS:.*true' /tmp/study-room-compose-base.yml; then
            echo 'Default Compose profile contains a dev/test JWKS fixture setting' >&2
            exit 1
          fi
      - name: Validate explicit development profile
        env:
          POSTGRES_PASSWORD: ci-only-compose-validation
        run: docker compose --env-file .env.dev.example --profile dev config --quiet
      - name: Validate explicit test profile
        env:
          POSTGRES_PASSWORD: ci-only-compose-validation
        run: docker compose --env-file .env.test.example --profile test config --quiet
      - name: Build server Compose image
        run: docker build -f server/Dockerfile .
