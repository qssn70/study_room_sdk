name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dart-dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan Dart and Flutter workspace dependencies
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --lockfile=./pubspec.lock

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace study-room-server run db:generate
      - run: npm run generate:contracts
      - run: npm run check:contracts
      - run: git diff --exit-code -- contracts server/src/generated packages/study_room_sdk/lib/src/generated_contract.dart
      - run: npm run build
      - run: npm --workspace study-room-server run test:coverage
      - run: npm audit --audit-level=high

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze SDK, UI, and example
        run: |
          dart analyze packages/study_room_sdk
          flutter analyze packages/study_room_ui
          flutter analyze apps/example_flutter
      - name: Test SDK with line and branch coverage
        working-directory: packages/study_room_sdk
        run: dart test --coverage-path=coverage/lcov.info --branch-coverage
      - run: node tool/check-lcov.mjs packages/study_room_sdk/coverage/lcov.info 80 80
      - name: Test UI with line coverage
        working-directory: packages/study_room_ui
        run: flutter test --coverage
      - run: node tool/check-lcov.mjs packages/study_room_ui/coverage/lcov.info 70
      - name: Test example
        working-directory: apps/example_flutter
        run: flutter test
      - name: Package publication checks
        run: |
          (cd packages/study_room_sdk && dart pub publish --dry-run)
          (cd packages/study_room_ui && flutter pub publish --dry-run)

  compose-config:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-compose-validation
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -f server/Dockerfile .
