name: Compose integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rate_limit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: study-room-rate-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PASSWORD: rate-${{ github.run_id }}-${{ github.run_attempt }}
      NODE_ENV: test
      STUDY_ROOM_RUNTIME_PROFILE: test
      STUDY_ROOM_ALLOW_INSECURE_JWKS: "true"
      STUDY_ROOM_ADMIN_JWKS_URL: http://jwks:4000/admin/jwks.json
      STUDY_ROOM_ADMIN_JWT_ISSUER: http://jwks:4000/admin
      STUDY_ROOM_ADMIN_JWT_AUDIENCE: study-room-admin
      E2E_FIXTURE_CONTROL_TOKEN: rate-fixture-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_RUN_ID: rate-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize evidence timing
        run: |
          mkdir -p artifacts
          date +%s > artifacts/job-started-at-epoch

      - name: Start isolated rate-limit stack
        id: start
        run: |
          docker compose --profile test up --build --detach --wait postgres redis jwks
          docker compose --profile test run --rm migrate
          docker compose --profile test run --rm --no-deps seed
          docker compose --profile test up --build --detach --wait proxy

      - name: Verify one shared IP quota across both API instances
        id: probe
        run: |
          docker compose --profile test run --rm --no-deps \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts" \
            -e E2E_RESULT_PATH=/artifacts/rate-limit.json \
            e2e node tool/e2e-rate-limit.mjs
          jq -e '.successfulRequests == 120 and .rejectedRequest == 121 and .rejectedStatus == 429' \
            artifacts/rate-limit.json > /dev/null

      - name: Capture structured result and diagnostics
        if: always()
        shell: bash
        run: |
          docker compose ps --all --format json > artifacts/compose-ps.json 2>&1 || true
          docker compose logs --no-color --timestamps > artifacts/compose.log 2>&1 || true
          if ! node server/tool/e2e-service-images.mjs \
            --compose-ps artifacts/compose-ps.json --output artifacts/service-images.json; then
            jq -n '{schemaVersion:1,services:{},assertions:{apiImagesPresent:false,apiImageIdsMatch:false},captureError:"service image capture failed"}' \
              > artifacts/service-images.json
          fi
          jq -n \
            --arg scenario rate-limit \
            --arg start '${{ steps.start.outcome }}' \
            --arg probe '${{ steps.probe.outcome }}' \
            '{scenario:$scenario,steps:{start:$start,probe:$probe}}' \
            > artifacts/result.json
          EVIDENCE_SCENARIO=rate-limit node server/tool/e2e-evidence-manifest.mjs
          jq -e '.assertions.apiImagesPresent and .assertions.apiImageIdsMatch' artifacts/service-images.json > /dev/null
          jq -e 'all(.steps[]; . == "success")' artifacts/result.json > /dev/null

      - name: Upload rate-limit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-rate-limit-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Remove rate-limit containers, networks, and volumes
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans --timeout 10

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: study-room-core-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PASSWORD: core-${{ github.run_id }}-${{ github.run_attempt }}
      NODE_ENV: test
      STUDY_ROOM_RUNTIME_PROFILE: test
      STUDY_ROOM_ALLOW_INSECURE_JWKS: "true"
      STUDY_ROOM_ADMIN_JWKS_URL: http://jwks:4000/admin/jwks.json
      STUDY_ROOM_ADMIN_JWT_ISSUER: http://jwks:4000/admin
      STUDY_ROOM_ADMIN_JWT_AUDIENCE: study-room-admin
      E2E_FIXTURE_CONTROL_TOKEN: core-fixture-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_ALLOW_SHORT_LIVED_TOKENS: "true"
      E2E_RUN_ID: core-${{ github.run_id }}-${{ github.run_attempt }}
      STUDY_ROOM_JWKS_CACHE_MS: 1000
      E2E_JWKS_RETIRE_WAIT_MS: 2500
    steps:
      - uses: actions/checkout@v4
      - name: Initialize evidence timing
        run: |
          mkdir -p artifacts
          date +%s > artifacts/job-started-at-epoch

      - name: Start isolated two-instance stack
        id: start
        run: |
          docker compose --profile test up --build --detach --wait postgres redis jwks
          docker compose --profile test run --rm migrate
          docker compose --profile test run --rm --no-deps seed
          docker compose --profile test up --build --detach --wait proxy

      - name: Verify migration replay is idempotent
        id: migration
        run: docker compose --profile test run --rm migrate

      - name: Cross-instance core flow and duplicate-event idempotency
        id: business
        run: |
          docker compose --profile test run --rm --no-deps \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts" \
            -e E2E_RESULT_PATH=/artifacts/core-flow.json \
            e2e

      - name: Authentication, tenant isolation, rotation, expiry, and application disable
        id: security
        run: |
          docker compose --profile test run --rm --no-deps \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts" \
            -e E2E_RESULT_PATH=/artifacts/security.json \
            e2e node tool/e2e-security.mjs

      - name: Verify PostgreSQL persistence across API and database restarts
        id: persistence
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile test run --rm --no-deps \
            -e E2E_PHASE=setup \
            e2e node tool/e2e-persistence.mjs
          docker compose stop --timeout 15 api-1 api-2
          docker compose stop --timeout 15 postgres
          docker compose up --detach --wait postgres
          docker compose --profile test up --detach --no-deps --wait api-1 api-2
          docker compose --profile test run --rm --no-deps \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts" \
            -e E2E_PHASE=verify \
            -e E2E_RESULT_PATH=/artifacts/persistence.json \
            e2e node tool/e2e-persistence.mjs

      - name: Verify database tenant and owner constraints with invalid writes
        id: database_integrity
        run: |
          docker compose --profile test run --rm --no-deps \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts" \
            -e E2E_RESULT_PATH=/artifacts/database-integrity.json \
            e2e node tool/e2e-database-integrity.mjs

      - name: Verify retention continues for disabled applications
        id: retention
        run: |
          docker compose --profile test run --rm --no-deps \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts" \
            -e E2E_RESULT_PATH=/artifacts/retention.json \
            e2e node tool/e2e-retention.mjs

      - name: Capture structured result and diagnostics
        if: always()
        shell: bash
        run: |
          docker compose ps --all --format json > artifacts/compose-ps.json 2>&1 || true
          docker compose logs --no-color --timestamps > artifacts/compose.log 2>&1 || true
          if ! node server/tool/e2e-service-images.mjs \
            --compose-ps artifacts/compose-ps.json --output artifacts/service-images.json; then
            jq -n '{schemaVersion:1,services:{},assertions:{apiImagesPresent:false,apiImageIdsMatch:false},captureError:"service image capture failed"}' \
              > artifacts/service-images.json
          fi
          jq -n \
            --arg scenario core \
            --arg start '${{ steps.start.outcome }}' \
            --arg migration '${{ steps.migration.outcome }}' \
            --arg business '${{ steps.business.outcome }}' \
            --arg security '${{ steps.security.outcome }}' \
            --arg persistence '${{ steps.persistence.outcome }}' \
            --arg databaseIntegrity '${{ steps.database_integrity.outcome }}' \
            --arg retention '${{ steps.retention.outcome }}' \
            '{scenario:$scenario,steps:{start:$start,migration:$migration,business:$business,security:$security,persistence:$persistence,databaseIntegrity:$databaseIntegrity,retention:$retention}}' \
            > artifacts/result.json
          EVIDENCE_SCENARIO=core node server/tool/e2e-evidence-manifest.mjs
          jq -e '.assertions.apiImagesPresent and .assertions.apiImageIdsMatch' artifacts/service-images.json > /dev/null
          jq -e 'all(.steps[]; . == "success")' artifacts/result.json > /dev/null

      - name: Upload core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Remove core containers, networks, and volumes
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans --timeout 10

  resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: study-room-resilience-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PASSWORD: resilience-${{ github.run_id }}-${{ github.run_attempt }}
      NODE_ENV: test
      STUDY_ROOM_RUNTIME_PROFILE: test
      STUDY_ROOM_ALLOW_INSECURE_JWKS: "true"
      STUDY_ROOM_ADMIN_JWKS_URL: http://jwks:4000/admin/jwks.json
      STUDY_ROOM_ADMIN_JWT_ISSUER: http://jwks:4000/admin
      STUDY_ROOM_ADMIN_JWT_AUDIENCE: study-room-admin
      E2E_FIXTURE_CONTROL_TOKEN: resilience-fixture-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_ALLOW_SHORT_LIVED_TOKENS: "true"
      E2E_RUN_ID: resilience-${{ github.run_id }}-${{ github.run_attempt }}
      STUDY_ROOM_PRESENCE_TTL_SECONDS: 4
      STUDY_ROOM_PRESENCE_REFRESH_SECONDS: 1
      E2E_PRESENCE_EXPIRE_WAIT_MS: 11000
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel:4318/v1/traces
      OTEL_SERVICE_NAME: study-room-server
      OTEL_BSP_SCHEDULE_DELAY: 60000
      OTEL_BSP_MAX_EXPORT_BATCH_SIZE: 8192
      OTEL_BSP_MAX_QUEUE_SIZE: 16384
    steps:
      - uses: actions/checkout@v4
      - name: Initialize evidence timing
        run: |
          mkdir -p artifacts
          date +%s > artifacts/job-started-at-epoch

      - name: Start isolated resilience stack
        id: start
        run: |
          cp deploy/nginx-upstream.conf artifacts/nginx-upstream.conf.original
          docker compose --profile test up --build --detach --wait postgres redis jwks otel
          docker compose --profile test run --rm migrate
          docker compose --profile test run --rm --no-deps seed
          docker compose --profile test up --build --detach --wait proxy

      - name: Verify dependency readiness failure and recovery
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          expect_status() {
            local expected="$1"
            local url="$2"
            local token="${3:-}"
            local label="${4:-probe}"
            local body="artifacts/${label}.body"
            local started_at
            local curl_metrics=""
            local last_status="000"
            local last_curl_exit="0"
            local last_request_seconds="0"
            local elapsed_seconds="0"
            local curl_args=(
              --max-time 8
              --silent
              --show-error
              --output "$body"
              --write-out $'%{http_code}\t%{time_total}'
            )
            started_at=$(date +%s)
            for _ in $(seq 1 45); do
              : > "$body"
              if [[ -n "$token" ]]; then
                if curl_metrics=$(curl "${curl_args[@]}" \
                  --header "Authorization: Bearer $token" "$url"); then
                  last_curl_exit=0
                else
                  last_curl_exit=$?
                fi
              else
                if curl_metrics=$(curl "${curl_args[@]}" "$url"); then
                  last_curl_exit=0
                else
                  last_curl_exit=$?
                fi
              fi
              IFS=$'\t' read -r last_status last_request_seconds <<< "$curl_metrics"
              last_status="${last_status:-000}"
              last_request_seconds="${last_request_seconds:-0}"
              if [[ "$last_status" == "$expected" ]]; then return 0; fi
              sleep 1
            done
            elapsed_seconds=$(( $(date +%s) - started_at ))
            printf 'Expected %s to return %s; last_status=%s curl_exit=%s request_seconds=%s elapsed_seconds=%s\n' \
              "$url" "$expected" "$last_status" "$last_curl_exit" \
              "$last_request_seconds" "$elapsed_seconds" >&2
            echo 'Last response body:' >&2
            cat "$body" >&2
            echo >&2
            return 1
          }
          expect_json_error() {
            local expected_status="$1"
            local expected_code="$2"
            local url="$3"
            local token="$4"
            local output="$5"
            local started_at
            local curl_metrics=""
            local last_status="000"
            local last_code=""
            local last_curl_exit="0"
            local last_request_seconds="0"
            local elapsed_seconds="0"
            started_at=$(date +%s)
            for _ in $(seq 1 45); do
              : > "$output"
              if curl_metrics=$(curl --max-time 8 --silent --show-error \
                --output "$output" --write-out $'%{http_code}\t%{time_total}' \
                --header "Authorization: Bearer $token" "$url"); then
                last_curl_exit=0
              else
                last_curl_exit=$?
              fi
              IFS=$'\t' read -r last_status last_request_seconds <<< "$curl_metrics"
              last_status="${last_status:-000}"
              last_request_seconds="${last_request_seconds:-0}"
              last_code=$(jq -r '.code // empty' "$output" 2>/dev/null || true)
              if [[ "$last_status" == "$expected_status" && "$last_code" == "$expected_code" ]]; then return 0; fi
              sleep 1
            done
            elapsed_seconds=$(( $(date +%s) - started_at ))
            printf 'Expected %s to return %s/%s; last_status=%s last_code=%s curl_exit=%s request_seconds=%s elapsed_seconds=%s\n' \
              "$url" "$expected_status" "$expected_code" "$last_status" \
              "${last_code:-<empty>}" "$last_curl_exit" "$last_request_seconds" \
              "$elapsed_seconds" >&2
            echo 'Last response body:' >&2
            cat "$output" >&2
            echo >&2
            return 1
          }
          service_url() {
            local service="$1"
            local container_id
            local address
            container_id=$(docker compose ps -q "$service")
            address=$(docker inspect "$container_id" | jq -er \
              '.[0].NetworkSettings.Networks | to_entries | map(.value.IPAddress | select(length > 0)) | first')
            printf 'http://%s:3000' "$address"
          }

          business_token=$(curl --max-time 8 --fail --silent --show-error \
            --header 'content-type: application/json' \
            --data "{\"sub\":\"resilience-${E2E_RUN_ID}\",\"displayName\":\"Resilience Probe\"}" \
            http://localhost:4000/token | jq -er '.accessToken')
          api_1_url=$(service_url api-1)
          api_2_url=$(service_url api-2)
          proxy_url=http://localhost:3000

          docker compose stop redis
          expect_status 200 "$proxy_url/health/live" '' redis-down-proxy-live
          expect_status 503 "$api_1_url/health/ready" '' redis-down-api-1-ready
          expect_status 503 "$api_2_url/health/ready" '' redis-down-api-2-ready
          expect_status 503 "$proxy_url/health/ready" '' redis-down-proxy-ready
          expect_json_error 503 rate_limit_unavailable "$proxy_url/v1/rooms" \
            "$business_token" artifacts/redis-down-business.json
          docker compose up --detach --wait redis
          expect_status 200 "$api_1_url/health/ready" '' redis-recovered-api-1-ready
          expect_status 200 "$api_2_url/health/ready" '' redis-recovered-api-2-ready
          expect_status 200 "$proxy_url/health/ready" '' redis-recovered-proxy-ready
          expect_status 200 "$proxy_url/v1/rooms" "$business_token" redis-recovered-business

          docker compose stop --timeout 0 postgres
          expect_status 200 "$proxy_url/health/live" '' postgres-down-proxy-live
          expect_status 503 "$api_1_url/health/ready" '' postgres-down-api-1-ready
          expect_status 503 "$api_2_url/health/ready" '' postgres-down-api-2-ready
          expect_status 503 "$proxy_url/health/ready" '' postgres-down-proxy-ready
          docker compose up --detach --wait postgres
          expect_status 200 "$api_1_url/health/ready" '' postgres-recovered-api-1-ready
          expect_status 200 "$api_2_url/health/ready" '' postgres-recovered-api-2-ready
          expect_status 200 "$proxy_url/health/ready" '' postgres-recovered-proxy-ready
          jq -n \
            '{redisDown:{live:200,api1Ready:503,api2Ready:503,proxyReady:503,businessStatus:503,businessCode:"rate_limit_unavailable"},redisRecovered:{api1Ready:200,api2Ready:200,proxyReady:200,businessStatus:200},postgresDown:{live:200,api1Ready:503,api2Ready:503,proxyReady:503},postgresRecovered:{api1Ready:200,api2Ready:200,proxyReady:200}}' \
            > artifacts/dependencies.json

      - name: Verify rolling replacement through dynamically resolved nginx upstreams
        id: rolling
        shell: bash
        run: |
          set -euo pipefail
          rm -f artifacts/rolling-probe.ready artifacts/rolling-probe.stop artifacts/rolling-probe.json
          docker compose --profile test run --rm --no-deps \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts" \
            -e E2E_PROBE_MAX_DURATION_MS=120000 \
            -e E2E_READY_PATH=/artifacts/rolling-probe.ready \
            -e E2E_STOP_PATH=/artifacts/rolling-probe.stop \
            -e E2E_RESULT_PATH=/artifacts/rolling-probe.json \
            e2e node tool/e2e-proxy-probe.mjs &
          probe_pid=$!
          cleanup_probe() {
            touch artifacts/rolling-probe.stop
            if kill -0 "$probe_pid" 2>/dev/null; then
              for _ in $(seq 1 25); do
                kill -0 "$probe_pid" 2>/dev/null || break
                sleep 0.2
              done
              kill -0 "$probe_pid" 2>/dev/null && kill "$probe_pid" || true
              wait "$probe_pid" 2>/dev/null || true
            fi
          }
          trap cleanup_probe EXIT
          for _ in $(seq 1 60); do
            [[ -f artifacts/rolling-probe.ready ]] && break
            sleep 1
          done
          [[ -f artifacts/rolling-probe.ready ]]
          restore_upstream() {
            cp artifacts/nginx-upstream.conf.original deploy/nginx-upstream.conf
            docker compose exec -T proxy nginx -t >/dev/null 2>&1 \
              && docker compose exec -T proxy nginx -s reload >/dev/null 2>&1 || true
          }
          trap 'restore_upstream; cleanup_probe' EXIT
          drain_and_replace() {
            local service="$1"
            awk -v service="$service" \
              '$0 ~ "server " service ":3000" { sub(/;$/, " down;") } { print }' \
              artifacts/nginx-upstream.conf.original > deploy/nginx-upstream.conf
            docker compose exec -T proxy nginx -t
            docker compose exec -T proxy nginx -s reload
            sleep 2
            docker compose --profile test up --detach --force-recreate --no-deps --wait "$service"
            cp artifacts/nginx-upstream.conf.original deploy/nginx-upstream.conf
            docker compose exec -T proxy nginx -t
            docker compose exec -T proxy nginx -s reload
            sleep 3
          }
          drain_and_replace api-1
          drain_and_replace api-2
          touch artifacts/rolling-probe.stop
          wait "$probe_pid"
          restore_upstream
          trap - EXIT

      - name: Verify liveness, readiness, and protected metrics
        id: operations
        run: |
          docker compose --profile test run --rm --no-deps \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts" \
            -e E2E_RESULT_PATH=/artifacts/operations.json \
            e2e node tool/e2e-operations.mjs

      - name: Verify graceful shutdown and OpenTelemetry flush
        id: graceful_otel
        shell: bash
        run: |
          set -euo pipefail
          rm -f artifacts/graceful-proxy.ready artifacts/graceful-proxy.stop artifacts/graceful-proxy.json \
            artifacts/graceful-api-2.ready artifacts/graceful-api-2.stop artifacts/graceful-api-2.json
          curl --max-time 5 --fail --silent http://localhost:3000/health/live > /dev/null
          curl --max-time 5 --fail --silent http://localhost:3000/health/live > /dev/null
          copied=false
          for _ in $(seq 1 30); do
            if docker compose cp otel:/var/lib/otel/traces.jsonl artifacts/otel-before-shutdown.jsonl \
              && [[ -s artifacts/otel-before-shutdown.jsonl ]]; then
              copied=true
              break
            fi
            sleep 1
          done
          if [[ "$copied" != true ]]; then
            echo 'OpenTelemetry collector did not write baseline trace evidence' >&2
            exit 1
          fi
          docker compose --profile test run --rm --no-deps \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts" \
            -e E2E_OTEL_TRACES_PATH=/artifacts/otel-before-shutdown.jsonl \
            -e E2E_RESULT_PATH=/artifacts/otel-before-shutdown.json \
            e2e node tool/e2e-otel.mjs
          shutdown_marker="graceful-${E2E_RUN_ID}-$(openssl rand -hex 16)"

          api_1_id=$(docker compose ps -q api-1)
          docker compose --profile test run --rm --no-deps \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts" \
            -e E2E_PROBE_MAX_DURATION_MS=120000 \
            -e E2E_READY_PATH=/artifacts/graceful-proxy.ready \
            -e E2E_STOP_PATH=/artifacts/graceful-proxy.stop \
            -e E2E_RESULT_PATH=/artifacts/graceful-proxy.json \
            e2e node tool/e2e-proxy-probe.mjs &
          probe_pid=$!
          docker compose --profile test run --rm --no-deps \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts" \
            -e E2E_HTTP_PROBE_URL=http://api-2:3000/health/ready \
            -e E2E_PROBE_MAX_DURATION_MS=120000 \
            -e E2E_READY_PATH=/artifacts/graceful-api-2.ready \
            -e E2E_STOP_PATH=/artifacts/graceful-api-2.stop \
            -e E2E_RESULT_PATH=/artifacts/graceful-api-2.json \
            e2e node tool/e2e-http-probe.mjs &
          api_2_probe_pid=$!
          cleanup_probe() {
            touch artifacts/graceful-proxy.stop artifacts/graceful-api-2.stop
            for pid in "$probe_pid" "$api_2_probe_pid"; do
              if kill -0 "$pid" 2>/dev/null; then
                for _ in $(seq 1 25); do
                  kill -0 "$pid" 2>/dev/null || break
                  sleep 0.2
                done
                kill -0 "$pid" 2>/dev/null && kill "$pid" || true
                wait "$pid" 2>/dev/null || true
              fi
            done
          }
          trap cleanup_probe EXIT
          for _ in $(seq 1 60); do
            [[ -f artifacts/graceful-proxy.ready && -f artifacts/graceful-api-2.ready ]] && break
            sleep 1
          done
          if [[ ! -f artifacts/graceful-proxy.ready || ! -f artifacts/graceful-api-2.ready ]]; then
            echo 'Graceful shutdown probes did not become ready' >&2
            exit 1
          fi
          awk \
            '$0 ~ "server api-1:3000" { sub(/;$/, " down;") } { print }' \
            artifacts/nginx-upstream.conf.original > deploy/nginx-upstream.conf
          docker compose exec -T proxy nginx -t
          docker compose exec -T proxy nginx -s reload
          sleep 2
          docker compose exec -T -e E2E_TRACE_MARKER="$shutdown_marker" api-2 \
            node -e '
              fetch("http://api-1:3000/health/live", {
                headers: {"x-study-room-e2e-trace-marker": process.env.E2E_TRACE_MARKER},
                signal: AbortSignal.timeout(5000),
              }).then((response) => {
                if (!response.ok) throw new Error(`Unexpected status ${response.status}`);
              }).catch((error) => { console.error(error); process.exit(1); });
            '
          docker compose cp otel:/var/lib/otel/traces.jsonl artifacts/otel-before-sigterm.jsonl
          [[ -s artifacts/otel-before-sigterm.jsonl ]]
          docker compose --profile test run --rm --no-deps \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts" \
            -e E2E_OTEL_TRACES_PATH=/artifacts/otel-before-sigterm.jsonl \
            -e E2E_OTEL_FORBIDDEN_MARKER="$shutdown_marker" \
            -e E2E_OTEL_FORBIDDEN_MARKER_INSTANCE=api-1 \
            -e E2E_RESULT_PATH=/artifacts/otel-before-sigterm.json \
            e2e node tool/e2e-otel.mjs
          baseline_spans=$(jq -c '{"api-1": .instanceSpanCounts["api-1"]}' \
            artifacts/otel-before-sigterm.json)
          docker compose stop --timeout 15 api-1
          curl --max-time 5 --fail --silent http://localhost:3000/health/live > /dev/null
          docker compose exec -T api-2 \
            node -e '
              fetch("http://localhost:3000/health/ready", {signal: AbortSignal.timeout(5000)})
                .then((response) => {
                  if (!response.ok) throw new Error(`Unexpected status ${response.status}`);
                }).catch((error) => { console.error(error); process.exit(1); });
            '
          touch artifacts/graceful-proxy.stop artifacts/graceful-api-2.stop
          wait "$probe_pid"
          wait "$api_2_probe_pid"
          trap - EXIT

          docker inspect "$api_1_id" | jq '.[0] | {
            containerId:.Id,
            state:{exitCode:.State.ExitCode,oomKilled:.State.OOMKilled,error:.State.Error,finishedAt:.State.FinishedAt}
          }' > artifacts/graceful-shutdown.json
          docker logs --timestamps "$api_1_id" > artifacts/api-1-graceful.log 2>&1
          jq -e '.state.exitCode == 0 and .state.oomKilled == false and .state.error == ""' \
            artifacts/graceful-shutdown.json > /dev/null
          jq -e '.passed and (.failures | length == 0)' artifacts/graceful-proxy.json > /dev/null
          jq -e '.passed and (.failures | length == 0)' artifacts/graceful-api-2.json > /dev/null
          grep -q 'Study Room API shutdown complete' artifacts/api-1-graceful.log

          flushed=false
          for _ in $(seq 1 30); do
            if docker compose cp otel:/var/lib/otel/traces.jsonl artifacts/otel-traces.jsonl \
              && [[ -s artifacts/otel-traces.jsonl ]]; then
              if docker compose --profile test run --rm --no-deps \
                -v "$GITHUB_WORKSPACE/artifacts:/artifacts" \
                -e E2E_OTEL_TRACES_PATH=/artifacts/otel-traces.jsonl \
                -e E2E_OTEL_MINIMUM_INSTANCE_SPANS="$baseline_spans" \
                -e E2E_OTEL_EXPECTED_MARKER="$shutdown_marker" \
                -e E2E_OTEL_EXPECTED_MARKER_INSTANCE=api-1 \
                -e E2E_RESULT_PATH=/artifacts/otel.json \
                e2e node tool/e2e-otel.mjs; then
                flushed=true
                break
              fi
            fi
            sleep 1
          done
          if [[ "$flushed" != true ]]; then
            echo 'OpenTelemetry collector did not receive the api-1 shutdown marker within 30 seconds' >&2
            exit 1
          fi
          docker compose --profile test up --detach --no-deps --wait api-1
          cp artifacts/nginx-upstream.conf.original deploy/nginx-upstream.conf
          docker compose exec -T proxy nginx -t
          docker compose exec -T proxy nginx -s reload

      - name: Verify presence expiry after SIGKILL
        id: crash
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile test run --rm --no-deps \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts" \
            -e E2E_RESULT_PATH=/artifacts/presence-crash.json \
            e2e node tool/e2e-presence-crash.mjs &
          crash_test_pid=$!
          cleanup_background() {
            if kill -0 "$crash_test_pid" 2>/dev/null; then kill "$crash_test_pid" || true; fi
          }
          trap cleanup_background EXIT

          ready=false
          for _ in $(seq 1 60); do
            if docker compose exec -T redis redis-cli EXISTS "e2e:presence-crash:${E2E_RUN_ID}" | grep -q '^1'; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "Presence crash scenario did not become ready" >&2
            exit 1
          fi

          api_2_id=$(docker compose ps -q api-2)
          docker update --restart=no "$api_2_id"
          docker kill --signal KILL "$api_2_id"
          wait "$crash_test_pid"
          trap - EXIT
          docker compose --profile test up --detach --force-recreate --no-deps --wait api-2

      - name: Capture structured result and diagnostics
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/nginx-upstream.conf.original ]]; then
            cp artifacts/nginx-upstream.conf.original deploy/nginx-upstream.conf
            docker compose exec -T proxy nginx -t >/dev/null 2>&1 \
              && docker compose exec -T proxy nginx -s reload >/dev/null 2>&1 || true
          fi
          docker compose ps --all --format json > artifacts/compose-ps.json 2>&1 || true
          docker compose logs --no-color --timestamps > artifacts/compose.log 2>&1 || true
          if ! node server/tool/e2e-service-images.mjs \
            --compose-ps artifacts/compose-ps.json --output artifacts/service-images.json; then
            jq -n '{schemaVersion:1,services:{},assertions:{apiImagesPresent:false,apiImageIdsMatch:false},captureError:"service image capture failed"}' \
              > artifacts/service-images.json
          fi
          jq -n \
            --arg scenario resilience \
            --arg start '${{ steps.start.outcome }}' \
            --arg dependencies '${{ steps.dependencies.outcome }}' \
            --arg rolling '${{ steps.rolling.outcome }}' \
            --arg operations '${{ steps.operations.outcome }}' \
            --arg gracefulOtel '${{ steps.graceful_otel.outcome }}' \
            --arg crash '${{ steps.crash.outcome }}' \
            '{scenario:$scenario,steps:{start:$start,dependencies:$dependencies,rolling:$rolling,operations:$operations,gracefulOtel:$gracefulOtel,crash:$crash}}' \
            > artifacts/result.json
          EVIDENCE_SCENARIO=resilience node server/tool/e2e-evidence-manifest.mjs
          jq -e '.assertions.apiImagesPresent and .assertions.apiImageIdsMatch' artifacts/service-images.json > /dev/null
          jq -e 'all(.steps[]; . == "success")' artifacts/result.json > /dev/null

      - name: Upload resilience evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-resilience-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Remove resilience containers, networks, and volumes
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans --timeout 10

  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: study-room-restore-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PASSWORD: restore-${{ github.run_id }}-${{ github.run_attempt }}
      NODE_ENV: test
      STUDY_ROOM_RUNTIME_PROFILE: test
      STUDY_ROOM_ALLOW_INSECURE_JWKS: "true"
      STUDY_ROOM_ADMIN_JWKS_URL: http://jwks:4000/admin/jwks.json
      STUDY_ROOM_ADMIN_JWT_ISSUER: http://jwks:4000/admin
      STUDY_ROOM_ADMIN_JWT_AUDIENCE: study-room-admin
      E2E_FIXTURE_CONTROL_TOKEN: restore-fixture-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_RUN_ID: restore-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize evidence timing
        run: |
          mkdir -p artifacts
          date +%s > artifacts/job-started-at-epoch

      - name: Start isolated restore stack
        id: start
        run: |
          docker compose --profile test up --build --detach --wait postgres redis jwks
          docker compose --profile test run --rm migrate
          docker compose --profile test run --rm --no-deps seed
          docker compose --profile test up --build --detach --wait proxy

      - name: Create data for logical backup
        id: setup
        run: docker compose --profile test run --rm --no-deps -e E2E_PHASE=setup -e E2E_STATE_PATH=/state/restore.json e2e node tool/e2e-restore.mjs

      - name: Dump and restore into a fresh PostgreSQL database
        id: backup_restore
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T postgres sh -ec 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f /tmp/study-room.dump'
          docker compose exec -T postgres sh -ec 'pg_restore -l /tmp/study-room.dump' > artifacts/restore-list.txt
          docker compose cp postgres:/tmp/study-room.dump artifacts/study-room.dump
          dump_sha256=$(sha256sum artifacts/study-room.dump | cut -d ' ' -f 1)
          dump_size=$(stat -c '%s' artifacts/study-room.dump)
          jq -n \
            --arg sha256 "$dump_sha256" \
            --argjson sizeBytes "$dump_size" \
            --arg format postgresql-custom \
            '{format:$format,sizeBytes:$sizeBytes,sha256:$sha256}' \
            > artifacts/dump-metadata.json
          docker compose exec -T postgres dropdb --if-exists -U study_room study_room_restore
          docker compose exec -T postgres createdb -U study_room study_room_restore
          docker compose exec -T postgres pg_restore --exit-on-error -U study_room -d study_room_restore /tmp/study-room.dump

      - name: Recreate both APIs against the restored database
        id: switch_database
        shell: bash
        run: POSTGRES_DB=study_room_restore docker compose --profile test up --detach --force-recreate --no-deps --wait api-1 api-2

      - name: Verify restored data through both APIs
        id: verify
        run: |
          docker compose --profile test run --rm --no-deps \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts" \
            -e E2E_PHASE=verify \
            -e E2E_STATE_PATH=/state/restore.json \
            -e E2E_RESULT_PATH=/artifacts/restore.json \
            e2e node tool/e2e-restore.mjs

      - name: Capture structured result and diagnostics
        if: always()
        shell: bash
        run: |
          docker compose ps --all --format json > artifacts/compose-ps.json 2>&1 || true
          docker compose logs --no-color --timestamps > artifacts/compose.log 2>&1 || true
          if ! node server/tool/e2e-service-images.mjs \
            --compose-ps artifacts/compose-ps.json --output artifacts/service-images.json; then
            jq -n '{schemaVersion:1,services:{},assertions:{apiImagesPresent:false,apiImageIdsMatch:false},captureError:"service image capture failed"}' \
              > artifacts/service-images.json
          fi
          jq -n \
            --arg scenario restore \
            --arg start '${{ steps.start.outcome }}' \
            --arg setup '${{ steps.setup.outcome }}' \
            --arg backupRestore '${{ steps.backup_restore.outcome }}' \
            --arg switchDatabase '${{ steps.switch_database.outcome }}' \
            --arg verify '${{ steps.verify.outcome }}' \
            '{scenario:$scenario,steps:{start:$start,setup:$setup,backupRestore:$backupRestore,switchDatabase:$switchDatabase,verify:$verify}}' \
            > artifacts/result.json
          EVIDENCE_SCENARIO=restore node server/tool/e2e-evidence-manifest.mjs
          jq -e '.assertions.apiImagesPresent and .assertions.apiImageIdsMatch' artifacts/service-images.json > /dev/null
          jq -e 'all(.steps[]; . == "success")' artifacts/result.json > /dev/null

      - name: Upload restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-restore-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Remove restore containers, networks, and volumes
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans --timeout 10

  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: study-room-soak-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PASSWORD: soak-${{ github.run_id }}-${{ github.run_attempt }}
      NODE_ENV: test
      STUDY_ROOM_RUNTIME_PROFILE: test
      STUDY_ROOM_ALLOW_INSECURE_JWKS: "true"
      STUDY_ROOM_ADMIN_JWKS_URL: http://jwks:4000/admin/jwks.json
      STUDY_ROOM_ADMIN_JWT_ISSUER: http://jwks:4000/admin
      STUDY_ROOM_ADMIN_JWT_AUDIENCE: study-room-admin
      E2E_FIXTURE_CONTROL_TOKEN: soak-fixture-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_RUN_ID: soak-${{ github.run_id }}-${{ github.run_attempt }}
      STUDY_ROOM_PRESENCE_TTL_SECONDS: 20
      STUDY_ROOM_PRESENCE_REFRESH_SECONDS: 5
    steps:
      - uses: actions/checkout@v4
      - name: Initialize evidence timing
        run: |
          mkdir -p artifacts
          date +%s > artifacts/job-started-at-epoch

      - name: Start isolated soak stack
        id: start
        run: |
          cp deploy/nginx-upstream.conf artifacts/nginx-upstream.conf.original
          docker compose --profile test up --build --detach --wait postgres redis jwks
          docker compose --profile test run --rm migrate
          docker compose --profile test run --rm --no-deps seed
          docker compose --profile test up --build --detach --wait proxy proxy-test

      - name: Run ten-minute mixed HTTP/WebSocket soak with rolling replacements
        id: workload
        shell: bash
        run: |
          set -euo pipefail
          rm -f artifacts/soak-proxy.ready artifacts/soak-proxy.stop artifacts/soak-proxy.json
          docker compose --profile test run --rm --no-deps \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts" \
            -e E2E_SOAK_DURATION_MS=600000 \
            -e E2E_EXPECTED_RECONNECTS=2 \
            -e E2E_RESULT_PATH=/artifacts/soak.json \
            e2e node tool/e2e-soak.mjs &
          soak_pid=$!
          docker compose --profile test run --rm --no-deps \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts" \
            -e E2E_PROBE_MAX_DURATION_MS=720000 \
            -e E2E_READY_PATH=/artifacts/soak-proxy.ready \
            -e E2E_STOP_PATH=/artifacts/soak-proxy.stop \
            -e E2E_RESULT_PATH=/artifacts/soak-proxy.json \
            e2e node tool/e2e-proxy-probe.mjs &
          proxy_probe_pid=$!
          cleanup_soak() {
            touch artifacts/soak-proxy.stop
            if kill -0 "$proxy_probe_pid" 2>/dev/null; then
              for _ in $(seq 1 25); do
                kill -0 "$proxy_probe_pid" 2>/dev/null || break
                sleep 0.2
              done
              kill -0 "$proxy_probe_pid" 2>/dev/null && kill "$proxy_probe_pid" || true
              wait "$proxy_probe_pid" 2>/dev/null || true
            fi
            if kill -0 "$soak_pid" 2>/dev/null; then
              kill "$soak_pid" || true
              wait "$soak_pid" 2>/dev/null || true
            fi
          }
          trap cleanup_soak EXIT
          jq -n \
            '{"api-1":{plannedOffsetSeconds:120,startedAt:null,completedAt:null},"api-2":{plannedOffsetSeconds:300,startedAt:null,completedAt:null}}' \
            > artifacts/soak-replacements.json
          record_replacement() {
            local service="$1"
            local field="$2"
            local timestamp
            timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            jq --arg service "$service" --arg field "$field" --arg timestamp "$timestamp" \
              '.[$service][$field] = $timestamp' artifacts/soak-replacements.json \
              > artifacts/soak-replacements.tmp
            mv artifacts/soak-replacements.tmp artifacts/soak-replacements.json
          }
          restore_upstream() {
            cp artifacts/nginx-upstream.conf.original deploy/nginx-upstream.conf
            docker compose exec -T proxy nginx -t >/dev/null 2>&1 \
              && docker compose exec -T proxy nginx -s reload >/dev/null 2>&1 || true
          }
          trap 'restore_upstream; cleanup_soak' EXIT
          drain_and_replace() {
            local service="$1"
            awk -v service="$service" \
              '$0 ~ "server " service ":3000" { sub(/;$/, " down;") } { print }' \
              artifacts/nginx-upstream.conf.original > deploy/nginx-upstream.conf
            docker compose exec -T proxy nginx -t
            docker compose exec -T proxy nginx -s reload
            sleep 2
            docker compose --profile test up --detach --force-recreate --no-deps --wait "$service"
            cp artifacts/nginx-upstream.conf.original deploy/nginx-upstream.conf
            docker compose exec -T proxy nginx -t
            docker compose exec -T proxy nginx -s reload
            docker compose exec -T proxy-test nginx -s reload
            sleep 3
          }
          wait_for_reconnect_count() {
            local expected="$1"
            local baseline="$2"
            local current
            for _ in $(seq 1 120); do
              current=$(docker compose exec -T redis redis-cli --raw GET "e2e:soak:${E2E_RUN_ID}:reconnects" | tr -d '\r' || true)
              if [[ "${current:-0}" =~ ^[0-9]+$ ]] && (( current >= baseline + expected )); then
                return 0
              fi
              sleep 1
            done
            echo "Soak did not observe ${expected} proxy WebSocket reconnect(s) after replacement" >&2
            return 1
          }

          ready=false
          for _ in $(seq 1 90); do
            if docker compose exec -T redis redis-cli EXISTS "e2e:soak:${E2E_RUN_ID}" | grep -q '^1'; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "Soak workload did not become ready" >&2
            exit 1
          fi
          for _ in $(seq 1 60); do
            [[ -f artifacts/soak-proxy.ready ]] && break
            sleep 1
          done
          [[ -f artifacts/soak-proxy.ready ]]

          sleep 120
          record_replacement api-1 startedAt
          reconnects_before=$(docker compose exec -T redis redis-cli --raw GET "e2e:soak:${E2E_RUN_ID}:reconnects" | tr -d '\r' || true)
          reconnects_before=${reconnects_before:-0}
          [[ "$reconnects_before" =~ ^[0-9]+$ ]]
          drain_and_replace api-1
          record_replacement api-1 completedAt
          wait_for_reconnect_count 1 "$reconnects_before"
          sleep 180
          record_replacement api-2 startedAt
          reconnects_before=$(docker compose exec -T redis redis-cli --raw GET "e2e:soak:${E2E_RUN_ID}:reconnects" | tr -d '\r' || true)
          reconnects_before=${reconnects_before:-0}
          [[ "$reconnects_before" =~ ^[0-9]+$ ]]
          drain_and_replace api-2
          record_replacement api-2 completedAt
          wait_for_reconnect_count 1 "$reconnects_before"
          wait "$soak_pid"
          touch artifacts/soak-proxy.stop
          wait "$proxy_probe_pid"
          restore_upstream
          trap - EXIT

      - name: Capture structured result and diagnostics
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/nginx-upstream.conf.original ]]; then
            cp artifacts/nginx-upstream.conf.original deploy/nginx-upstream.conf
            docker compose exec -T proxy nginx -t >/dev/null 2>&1 \
              && docker compose exec -T proxy nginx -s reload >/dev/null 2>&1 || true
          fi
          docker compose ps --all --format json > artifacts/compose-ps.json 2>&1 || true
          docker compose logs --no-color --timestamps > artifacts/compose.log 2>&1 || true
          if ! node server/tool/e2e-service-images.mjs \
            --compose-ps artifacts/compose-ps.json --output artifacts/service-images.json; then
            jq -n '{schemaVersion:1,services:{},assertions:{apiImagesPresent:false,apiImageIdsMatch:false},captureError:"service image capture failed"}' \
              > artifacts/service-images.json
          fi
          jq -n \
            --arg scenario soak \
            --arg start '${{ steps.start.outcome }}' \
            --arg workload '${{ steps.workload.outcome }}' \
            '{scenario:$scenario,steps:{start:$start,workload:$workload}}' \
            > artifacts/result.json
          EVIDENCE_SCENARIO=soak node server/tool/e2e-evidence-manifest.mjs
          jq -e '.assertions.apiImagesPresent and .assertions.apiImageIdsMatch' artifacts/service-images.json > /dev/null
          jq -e 'all(.steps[]; . == "success")' artifacts/result.json > /dev/null

      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-soak-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Remove soak containers, networks, and volumes
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans --timeout 10
