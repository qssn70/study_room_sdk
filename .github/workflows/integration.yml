name: Compose integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: study-room-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_FIXTURE_CONTROL_TOKEN: fixture-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_ALLOW_SHORT_LIVED_TOKENS: "true"
      E2E_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      STUDY_ROOM_JWKS_CACHE_MS: 1000
      E2E_JWKS_RETIRE_WAIT_MS: 2500
      STUDY_ROOM_PRESENCE_TTL_SECONDS: 4
      STUDY_ROOM_PRESENCE_REFRESH_SECONDS: 1
      E2E_PRESENCE_EXPIRE_WAIT_MS: 6000
    steps:
      - uses: actions/checkout@v4

      - name: Start two-instance stack
        run: docker compose up --build --detach --wait proxy

      - name: Cross-instance business flow
        run: docker compose --profile test run --rm e2e

      - name: Prepare persisted state
        run: docker compose --profile test run --rm -e E2E_PHASE=setup e2e node tool/e2e-persistence.mjs

      - name: Restart PostgreSQL and both APIs
        run: |
          docker compose stop api-1 api-2
          docker compose restart postgres
          docker compose up --detach --wait postgres api-1 api-2 proxy

      - name: Verify persisted state
        run: docker compose --profile test run --rm -e E2E_PHASE=verify e2e node tool/e2e-persistence.mjs

      - name: Authentication, tenant, rotation, expiry, and disable scenarios
        run: docker compose --profile test run --rm e2e node tool/e2e-security.mjs

      - name: Verify presence expiry after an abnormal API exit
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile test run --rm e2e node tool/e2e-presence-crash.mjs &
          crash_test_pid=$!
          cleanup_background() {
            if kill -0 "$crash_test_pid" 2>/dev/null; then kill "$crash_test_pid" || true; fi
          }
          trap cleanup_background EXIT

          ready=false
          for _ in $(seq 1 60); do
            if docker compose exec -T redis redis-cli EXISTS "e2e:presence-crash:${E2E_RUN_ID}" | grep -q '^1'; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "Presence crash scenario did not become ready" >&2
            exit 1
          fi

          api_2_id=$(docker compose ps -q api-2)
          docker update --restart=no "$api_2_id"
          docker kill --signal KILL "$api_2_id"
          wait "$crash_test_pid"
          trap - EXIT
          docker compose up --detach --force-recreate --wait api-2

      - name: Capture Compose diagnostics
        if: always()
        run: |
          docker compose ps --all > compose-ps.txt 2>&1 || true
          docker compose logs --no-color --timestamps > compose-integration.log 2>&1 || true

      - name: Upload Compose diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            compose-ps.txt
            compose-integration.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove integration resources
        if: always()
        run: docker compose down --volumes --remove-orphans --timeout 10
