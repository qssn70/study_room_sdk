name: Flutter platform builds

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: web
            command: flutter build web
          - os: ubuntu-latest
            target: android
            command: flutter build apk --debug
          - os: ubuntu-latest
            target: linux
            command: flutter build linux --debug
          - os: windows-latest
            target: windows
            command: flutter build windows --debug
          - os: macos-latest
            target: macos
            command: flutter build macos --debug
          - os: macos-latest
            target: ios
            command: flutter build ios --debug --no-codesign
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter pub get
      - name: Build ${{ matrix.target }}
        working-directory: apps/example_flutter
        run: ${{ matrix.command }}
