name: Temporary hoisted NestJS lockfile repair
on:
  push:
    branches: ['dependabot/npm_and_yarn/nestjs/platform-socket.io-12.3.2']
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Re-resolve the full dependency graph without stale v11 hoisting
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(nest): de-duplicate core v11 from lockfile'
            git push
          fi
