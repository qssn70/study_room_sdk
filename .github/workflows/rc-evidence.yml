name: RC evidence

on:
  workflow_dispatch:
    inputs:
      rc_sha:
        description: Frozen full 40-character main commit SHA
        required: true
        type: string
      issue_number:
        description: RC tracking issue containing the SHA and screenshot attachments
        required: true
        type: number
      screenshot_urls:
        description: JSON array of Ruleset UI screenshot attachment URLs
        required: true
        type: string
      verified_by:
        description: GitHub account that verified the Ruleset UI
        required: true
        type: string
      captured_at_utc:
        description: ISO-8601 UTC time when the Ruleset UI was captured
        required: true
        type: string

permissions:
  actions: write
  checks: read
  contents: read
  issues: write

concurrency:
  group: rc-evidence-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate explicit RC identity
        shell: bash
        env:
          RC_SHA: ${{ inputs.rc_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RC_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'rc_sha must be a full lowercase 40-character SHA' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo "RC evidence must be dispatched from main, not $GITHUB_REF" >&2
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$RC_SHA" ]]; then
            echo "The dispatched main workflow SHA $GITHUB_SHA does not match frozen RC $RC_SHA" >&2
            exit 1
          fi
      - name: Require the RC evidence credential
        shell: bash
        env:
          RC_EVIDENCE_TOKEN: ${{ secrets.RC_EVIDENCE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$RC_EVIDENCE_TOKEN" ]]; then
            echo 'RC_EVIDENCE_TOKEN is required to read repository Rulesets and collect RC evidence' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rc_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm checkout did not drift
        shell: bash
        env:
          RC_SHA: ${{ inputs.rc_sha }}
        run: test "$(git rev-parse HEAD)" = "$RC_SHA"
      - name: Collect and verify RC evidence
        id: collect_evidence
        env:
          GITHUB_TOKEN: ${{ secrets.RC_EVIDENCE_TOKEN }}
          RC_SHA: ${{ inputs.rc_sha }}
          RC_ISSUE_NUMBER: ${{ inputs.issue_number }}
          RC_SCREENSHOT_URLS: ${{ inputs.screenshot_urls }}
          RC_VERIFIED_BY: ${{ inputs.verified_by }}
          RC_CAPTURED_AT_UTC: ${{ inputs.captured_at_utc }}
          RC_EVIDENCE_DIR: artifacts/rc-evidence-${{ inputs.rc_sha }}
        run: node tool/collect-rc-evidence.mjs
      - name: Upload accepted RC evidence
        id: accepted
        uses: actions/upload-artifact@v4
        with:
          name: rc-evidence-${{ inputs.rc_sha }}
          path: artifacts/rc-evidence-${{ inputs.rc_sha }}
          if-no-files-found: error
          retention-days: 90
      - name: Verify accepted artifact output
        id: verify_accepted
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.accepted.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.accepted.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.accepted.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_URL" == https://github.com/*/actions/runs/*/artifacts/* ]]
          [[ "$ARTIFACT_DIGEST" =~ ^(sha256:)?[a-f0-9]{64}$ ]]
      - name: Record accepted artifact on the RC issue
        id: comment
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.accepted.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.accepted.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.accepted.outputs.artifact-digest }}
        with:
          script: |
            const sha = '${{ inputs.rc_sha }}';
            const body = [
              `RC evidence artifact uploaded for \`${sha}\`.`,
              `Acceptance condition: this exact RC evidence workflow must conclude successfully.`,
              '',
              `Artifact: [rc-evidence-${sha}](${process.env.ARTIFACT_URL})`,
              `Artifact ID: \`${process.env.ARTIFACT_ID}\``,
              `Artifact SHA-256: \`${process.env.ARTIFACT_DIGEST}\``,
              `Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ inputs.issue_number }}'),
              body,
            });
      - name: Require the RC issue record
        if: ${{ steps.comment.outcome != 'success' }}
        shell: bash
        run: |
          echo 'Accepted artifact could not be recorded on the RC issue' >&2
          exit 1
      - name: Roll back an unfinalized accepted artifact
        id: rollback
        if: ${{ failure() && steps.accepted.outcome == 'success' }}
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.accepted.outputs.artifact-id }}
        with:
          script: |
            const artifactId = Number(process.env.ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error(`Invalid accepted artifact ID: ${process.env.ARTIFACT_ID}`);
            }
            const parameters = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifactId,
            };
            for (let attempt = 1; attempt <= 5; attempt += 1) {
              try {
                await github.rest.actions.deleteArtifact(parameters);
                break;
              } catch (error) {
                if (error.status === 404) break;
                if (attempt === 5) throw error;
                await new Promise((resolve) => setTimeout(resolve, attempt * 1000));
              }
            }
            try {
              await github.rest.actions.getArtifact(parameters);
              throw new Error(`Accepted artifact ${artifactId} still exists after rollback`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.info(`Confirmed deletion of unfinalized accepted artifact ${artifactId}`);
      - name: Prepare failed collection diagnostics
        if: failure()
        shell: bash
        env:
          ACCEPTED_OUTCOME: ${{ steps.accepted.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect_evidence.outcome }}
          COMMENT_OUTCOME: ${{ steps.comment.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
          RC_SHA: ${{ inputs.rc_sha }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILURE_DIRECTORY: artifacts/rc-evidence-failure-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$FAILURE_DIRECTORY"
          rm -f "$FAILURE_DIRECTORY/rc.json" "$FAILURE_DIRECTORY/rc.md" "$FAILURE_DIRECTORY/SHA256SUMS"
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const record = {
              schemaVersion: 1,
              accepted: false,
              commitSha: process.env.RC_SHA,
              workflowRunUrl: process.env.WORKFLOW_RUN_URL,
              steps: {
                collect: process.env.COLLECT_OUTCOME || "not-run",
                acceptedArtifact: process.env.ACCEPTED_OUTCOME || "not-run",
                issueComment: process.env.COMMENT_OUTCOME || "not-run",
                rollback: process.env.ROLLBACK_OUTCOME || "not-run",
              },
            };
            fs.writeFileSync(
              path.join(process.env.FAILURE_DIRECTORY, "failure-context.json"),
              `${JSON.stringify(record, null, 2)}\n`,
            );
          '
      - name: Upload failed collection diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rc-evidence-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/rc-evidence-failure-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
