name: Temporary safe security updates
on:
  push:
    branches: ['dependabot/npm_and_yarn/nestjs/platform-socket.io-12.3.2']
permissions:
  contents: write
jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Update known vulnerable dependencies without force
        shell: bash
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit safe dependency updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(security): refresh patched npm transitive dependencies'
            git push
          fi
