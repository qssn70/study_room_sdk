version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      npm-patch-minor:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: pub
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      pub-patch-minor:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions-patch-minor:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - /
      - /server
    schedule: { interval: weekly, day: monday }
    groups:
      docker-patch-minor:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 5
