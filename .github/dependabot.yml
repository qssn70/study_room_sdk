version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      npm-patch-minor:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: pub
    directory: /
    # Flutter 3.44.1 pins intl to 0.20.2 via flutter_localizations.
    # Revisit this exclusion when upgrading the supported Flutter SDK.
    ignore:
      - dependency-name: intl
        versions: ['0.20.3']
    schedule: { interval: weekly, day: monday }
    groups:
      pub-patch-minor:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions-patch-minor:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - /
      - /server
    schedule: { interval: weekly, day: monday }
    groups:
      docker-patch-minor:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 5
