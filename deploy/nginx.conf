events {}

http {
  # Refresh Docker DNS quickly enough for zero-downtime container replacement.
  resolver 127.0.0.11 valid=1s ipv6=off;
  resolver_timeout 1s;

  upstream study_room_api {
    zone study_room_api 64k;
    include /etc/nginx/conf.d/study-room-upstream.conf;
  }

  server {
    listen 8080;
    client_max_body_size 64k;

    location / {
      proxy_pass http://study_room_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 75s;
      # Fail over promptly if an instance disappears outside the drain flow.
      proxy_connect_timeout 1s;
      proxy_next_upstream error timeout http_502 http_504;
      proxy_next_upstream_tries 2;
      proxy_next_upstream_timeout 2s;
    }
  }
}
