events {}

http {
  resolver 127.0.0.11 valid=1s ipv6=off;
  resolver_timeout 1s;

  upstream api_1_e2e {
    zone api_1_e2e 32k;
    server api-1:3000 resolve max_fails=0;
  }

  upstream api_2_e2e {
    zone api_2_e2e 32k;
    server api-2:3000 resolve max_fails=0;
  }

  server {
    listen 8080;
    server_name api-1-proxy;

    location / {
      proxy_pass http://api_1_e2e;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 75s;
      proxy_connect_timeout 1s;
    }
  }

  server {
    listen 8080;
    server_name api-2-proxy;

    location / {
      proxy_pass http://api_2_e2e;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 75s;
      proxy_connect_timeout 1s;
    }
  }
}
