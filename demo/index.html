<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Study Room Demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="room-band" aria-label="Study room">
        <header class="topbar">
          <div>
            <p class="eyebrow">SDK Demo Room</p>
            <h1>Morning Focus Room</h1>
          </div>
          <div class="connection" id="connectionStatus">
            <span class="pulse"></span>
            Connected
          </div>
        </header>

        <section class="workspace">
          <aside class="members-panel" aria-label="Members">
            <div class="panel-heading">
              <h2>Members</h2>
              <span id="onlineCount">4 online</span>
            </div>
            <div class="member-grid" id="memberGrid"></div>
          </aside>

          <section class="focus-panel" aria-label="Focus session">
            <div class="timer-face">
              <span id="timerDisplay">25:00</span>
              <small id="timerState">Ready</small>
            </div>
            <div class="timer-actions" aria-label="Timer controls">
              <button class="icon-button primary" id="startButton" type="button" title="Start">
                <span aria-hidden="true">▶</span>
              </button>
              <button class="icon-button" id="pauseButton" type="button" title="Pause">
                <span aria-hidden="true">Ⅱ</span>
              </button>
              <button class="icon-button" id="resetButton" type="button" title="Reset">
                <span aria-hidden="true">■</span>
              </button>
            </div>
            <div class="stats-row" aria-label="Session stats">
              <div>
                <strong id="focusMinutes">0</strong>
                <span>minutes</span>
              </div>
              <div>
                <strong id="sessionCount">0</strong>
                <span>sessions</span>
              </div>
              <div>
                <strong id="chatCount">2</strong>
                <span>messages</span>
              </div>
            </div>
          </section>

          <section class="chat-panel" aria-label="Room chat">
            <div class="panel-heading">
              <h2>Chat</h2>
              <button class="text-button" id="toggleConnection" type="button">Reconnect</button>
            </div>
            <div class="messages" id="messages"></div>
            <form class="composer" id="chatForm">
              <input
                id="messageInput"
                name="message"
                autocomplete="off"
                placeholder="Message"
                aria-label="Message"
              />
              <button class="icon-button primary" type="submit" title="Send">
                <span aria-hidden="true">➜</span>
              </button>
            </form>
          </section>
        </section>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
